<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog — Goodboy Dynamics</title>
    <meta name="description" content="An article from the Goodboy Dynamics workshop log." />
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link
      href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/blog.css" />
    <link rel="stylesheet" href="/css/navigation.css" />
    <script src="/js/navigation.js" defer></script>
  </head>
  <body data-page="post">
    <a class="skip-link" href="#post">Skip to content</a>

    <div class="grain" aria-hidden="true"></div>
    <div class="progress" id="progress" aria-hidden="true"></div>

    <header class="topbar">
      <a class="brand" href="/" aria-label="Goodboy Dynamics home">
        <img class="brand__mark" src="assets/goodboysvg.svg" alt="Goodboy" />
        <span class="brand__sub">Dynamics</span>
      </a>
      <a class="topbar__link" href="/blog">All posts</a>
    </header>

    <main id="top">
      <article class="article" id="post">
        <div class="article__inner">
          <div class="skeleton" id="post-skeleton" aria-hidden="true">
            <div class="skeleton__line skeleton__line--title" style="width: 72%"></div>
            <div class="skeleton__line" style="width: 30%"></div>
            <div class="skeleton__media"></div>
            <div class="skeleton__lines">
              <div class="skeleton__line" style="width: 94%"></div>
              <div class="skeleton__line" style="width: 88%"></div>
              <div class="skeleton__line" style="width: 91%"></div>
              <div class="skeleton__line" style="width: 47%"></div>
            </div>
          </div>
          <div id="post-content" hidden></div>
          <div class="status" id="post-status" role="status" aria-live="polite"></div>
        </div>
      </article>
    </main>

    <footer class="foot">
      <div class="foot__inner">
        <a class="brand" href="/" aria-label="Goodboy Dynamics home">
          <img class="brand__mark" src="assets/goodboysvg.svg" alt="Goodboy" />
          <span class="brand__sub">Dynamics</span>
        </a>
        <p class="foot__legal">© 2026 Goodboy Dynamics. All rights reserved.</p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lenis@1.3.8/dist/lenis.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/blog.js"></script>
  </body>
</html>

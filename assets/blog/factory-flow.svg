<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Paused inspection fills its waiting buffer and blocks processing</title>
  <desc id="desc">Inspection at station C pauses. Two finished parts fill its waiting buffer. Station B holds a third finished part and cannot transfer it. Preparation at A can eventually become blocked as its own downstream buffer fills. This is an illustrative model rather than measured data.</desc>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#eeeae0} .fine{fill:none;stroke:#eeeae0;stroke-width:2} .muted{fill:#d6cbb4} .quiet{stroke:#d6cbb4;stroke-opacity:.4} .label{font-size:23px;letter-spacing:2px} .big{font-size:50px} .small{font-size:23px} .piece{fill:#d6cbb4} .wait{animation:arrive 3.8s ease-out 1 both} .cause{animation:cause 1.2s ease-out 1 both} .upstream{animation:reveal 4.2s ease-out 1 both} .downstream{animation:reveal 4.8s ease-out 1 both}
    @keyframes arrive{0%,20%{opacity:0;transform:translateX(-22px)}65%,100%{opacity:1;transform:translateX(0)}}
    @keyframes cause{0%{opacity:.3}100%{opacity:1}}
    @keyframes reveal{0%,48%{opacity:0}100%{opacity:1}}
    @media(prefers-reduced-motion:reduce){.wait,.cause,.upstream,.downstream{animation:none}}
  </style>
  <rect width="1200" height="800" fill="#1b1b19"/>
  <text x="70" y="83" class="label muted">FINITE CAPACITY / ILLUSTRATIVE MODEL</text>
  <text x="70" y="143" font-size="38">Inspection pauses. The queue fills.</text>
  <path d="M70 175H1130" class="fine quiet"/>
  <g class="fine quiet">
    <path d="M210 376H490M650 376H930"/>
    <path d="m475 368 15 8-15 8m440-16 15 8-15 8"/>
  </g>
  <g>
    <rect x="70" y="300" width="160" height="152" rx="4" class="fine"/>
    <text x="150" y="368" text-anchor="middle" class="big">A</text>
    <text x="150" y="410" text-anchor="middle" class="small">PREPARE</text>
    <rect x="500" y="300" width="160" height="152" rx="4" class="fine"/>
    <text x="580" y="368" text-anchor="middle" class="big">B</text>
    <text x="580" y="410" text-anchor="middle" class="small">PROCESS</text>
    <rect x="930" y="300" width="200" height="152" rx="4" class="fine"/>
    <text x="1030" y="368" text-anchor="middle" class="big">C</text>
    <text x="1030" y="410" text-anchor="middle" class="small">INSPECT</text>
  </g>
  <g>
    <text x="365" y="279" text-anchor="middle" class="label muted">BUFFER 01</text>
    <rect x="297" y="349" width="56" height="56" class="fine"/>
    <rect x="377" y="349" width="56" height="56" class="fine"/>


    <rect x="306" y="358" width="38" height="38" class="piece" opacity=".5"/>
    <text x="365" y="452" text-anchor="middle" class="small">FILLING</text>
    <text x="795" y="279" text-anchor="middle" class="label muted">BUFFER 02</text>
    <rect x="727" y="349" width="56" height="56" class="fine quiet"/>
    <rect x="807" y="349" width="56" height="56" class="fine quiet"/>
    <rect x="736" y="358" width="38" height="38" class="piece"/>
    <rect x="816" y="358" width="38" height="38" class="piece wait"/>
    <text x="795" y="452" text-anchor="middle" class="small">2 / 2 · FULL</text>
  </g>
  <g class="cause">
    <path d="M1018 235v29m24-29v29" stroke="#d6cbb4" stroke-width="7"/>
    <text x="580" y="504" text-anchor="middle" class="label muted">BLOCKED</text>
    <text x="580" y="543" text-anchor="middle" class="small">Holds third finished part</text>
  </g>
  <g class="upstream">
    <text x="150" y="504" text-anchor="middle" class="label muted">PREPARING</text>
    <text x="150" y="543" text-anchor="middle" class="small">May block next</text>


  </g>
  <g class="downstream">
    <text x="1030" y="504" text-anchor="middle" class="label muted">PAUSED</text>
    <text x="1030" y="543" text-anchor="middle" class="small">Work stops here</text>
    <path d="M1030 598H150m15-8-15 8 15 8" class="fine"/>
    <text x="590" y="637" text-anchor="middle" class="small muted">A full buffer sends the constraint upstream</text>
  </g>
  <path d="M70 691H1130" class="fine quiet"/>
  <text x="70" y="738" class="small muted">B remains healthy. It has finished work and nowhere to put it.</text>
</svg>

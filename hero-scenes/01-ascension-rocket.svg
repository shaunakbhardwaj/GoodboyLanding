  <g id="scene" fill="none" stroke="#f6f3ee" stroke-linecap="round" stroke-linejoin="round">

    <g id="halo">
      <circle cx="1220" cy="420" r="340" stroke-opacity="0.07" stroke-width="1.5"/>
      <circle cx="1220" cy="420" r="262" stroke-opacity="0.05" stroke-width="1"/>
      <circle cx="1220" cy="420" r="340" stroke="#d6c4a8" stroke-opacity="0.22" stroke-width="1.5" stroke-dasharray="150 1986" stroke-dashoffset="1650"/>
    </g>


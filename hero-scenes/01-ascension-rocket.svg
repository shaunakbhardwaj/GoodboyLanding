<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="L Ascension - line-art rocket rising through layered clouds">
  <!--
    L'ASCENSION - static hero scenery for Goodboy Dynamics (Matisse line economy x Cassandre machine-age poise)
    Named animatable layers, back to front, with suggested motion:
      sky-scale    : fixed altitude ruler; ticks could count upward on scroll
      halo         : slow 2-3 degree rotation, or gentle opacity breathe
      stars        : very slow twinkle via opacity
      clouds-back  : slow horizontal drift left, ~60s loop
      clouds-mid   : slower counter-drift right, ~90s loop
      rocket       : subtle vertical translate + rotation on scroll
      plume        : dash shimmer on the mach diamonds, scale pulse on core lines
      clouds-front : gentle drift left, ~45s loop, with slight vertical bob
    Central zone (x 480-1120, y 280-720) kept calm for the logo; clouds there are faint contours only.
  -->

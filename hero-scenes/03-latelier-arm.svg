<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!--
    Goodboy Dynamics . hero scene 03 "L'Atelier" (static, animation ready)
    Layer map and suggested motions. Pivots are the nested translate origins;
    to drive motion later, append rotate(deg) to a group transform (chain follows):
      arm-base      pedestal, column, crank wheel; suggested: none (or 1px sway)
      arm-shoulder  rotate about (225,660) plus/minus 3 deg
      arm-elbow     rotate about (380,350) plus/minus 4 deg
      arm-wrist     rotate about (454,628) plus/minus 6 deg
      gripper       rotate about (454,662) plus/minus 2 deg; jaws translate 3px apart
      chip          translate down 21px to bench for the release; smiley stays etched
      bench         static; calibration ticks and landing target
      motion-ghost  dash-offset drift along path; opacity 0.2 to 0.45
    Ink #f6f3ee (opacity 0.08 to 0.95), accent #d6c4a8 (chip, motion arc), bg #2a2824
  -->
  <rect x="0" y="0" width="1600" height="1000" fill="#2a2824"/>
  <g stroke="#f6f3ee" fill="none" stroke-linecap="round" stroke-linejoin="round">

    <g id="ground">
      <path d="M40,950 H620" stroke-width="1.5" stroke-opacity="0.35"/>
      <path d="M620,950 H880" stroke-width="1.5" stroke-opacity="0.12"/>
      <path d="M60,964 H380" stroke-width="1" stroke-opacity="0.08"/>
    </g>

    <g id="bench">
      <path d="M390,740 H556" stroke-width="2.5" stroke-opacity="0.85"/>
      <path d="M390,753 H556" stroke-width="1.5" stroke-opacity="0.4"/>
      <path d="M390,740 V753" stroke-width="1.5" stroke-opacity="0.4"/>
      <path d="M556,740 V753" stroke-width="1.5" stroke-opacity="0.4"/>
      <path d="M412,753 V950" stroke-width="2.2" stroke-opacity="0.8"/>
      <path d="M534,753 V950" stroke-width="2.2" stroke-opacity="0.8"/>
      <path d="M412,876 H534" stroke-width="1.5" stroke-opacity="0.3"/>
      <path d="M428,735 V745" stroke-width="1" stroke-opacity="0.45"/>
      <path d="M498,735 V745" stroke-width="1" stroke-opacity="0.45"/>
      <path d="M522,735 V745" stroke-width="1" stroke-opacity="0.45"/>
      <ellipse cx="454" cy="740" rx="10" ry="3" stroke="#d6c4a8" stroke-width="1.2" stroke-opacity="0.35"/>
      <path d="M444,740 H448 M460,740 H464" stroke-width="1" stroke-opacity="0.3"/>
      <path d="M564,740 H790" stroke-width="1.5" stroke-opacity="0.15" stroke-dasharray="2 9"/>
    </g>

    <g id="motion-ghost" stroke="#d6c4a8">
      <path d="M438,692 C420,560 406,420 428,310 C444,244 492,238 556,224 C680,194 880,172 1032,234"
            stroke-width="2" stroke-opacity="0.45" stroke-dasharray="2 9"/>
      <circle cx="1032" cy="234" r="5" stroke-width="1.5" stroke-opacity="0.35"/>
      <path d="M1024,227 L1017,220 M1040,227 L1047,220" stroke-width="1" stroke-opacity="0.35"/>
      <path d="M454,724 V733" stroke="#f6f3ee" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="2 5"/>
    </g>

    <g id="arm-base">
      <path d="M140,830 H330 V950 H140 Z" stroke-width="2.5" stroke-opacity="0.9"/>
      <path d="M150,842 H320" stroke-width="1" stroke-opacity="0.25"/>
      <circle cx="168" cy="905" r="4.5" stroke-width="1.2" stroke-opacity="0.45"/>
      <circle cx="302" cy="905" r="4.5" stroke-width="1.2" stroke-opacity="0.45"/>
      <path d="M203,830 L209,678 L241,678 L247,830" stroke-width="2.2" stroke-opacity="0.9"/>
      <path d="M206,760 H244" stroke-width="1" stroke-opacity="0.3"/>
      <circle cx="245" cy="880" r="26" stroke-width="2" stroke-opacity="0.5"/>
      <path d="M224.3,872.5 L265.7,887.5" stroke-width="1.5" stroke-opacity="0.45"/>
      <path d="M238,899.3 L252,860.7" stroke-width="1.5" stroke-opacity="0.45"/>
      <circle cx="245" cy="880" r="5" stroke-width="1.5" stroke-opacity="0.5"/>
      <circle cx="251.5" cy="868.7" r="2.5" stroke-width="1" stroke-opacity="0.4"/>
      <path d="M251.5,868.7 L262,859" stroke-width="1" stroke-opacity="0.4"/>
      <circle cx="262" cy="859" r="2" stroke-width="1" stroke-opacity="0.4"/>

      <g id="arm-shoulder" transform="translate(225,660)">
        <path d="M28.6,14.3 L174.7,-300.2 L135.3,-319.8 L-28.6,-14.3 Z" stroke-width="2.5" stroke-opacity="0.9"/>
        <path d="M14.3,7.2 L169.3,-302.8" stroke-width="1" stroke-opacity="0.3"/>
        <circle cx="54.3" cy="-108.5" r="10" stroke-width="1.5" stroke-opacity="0.5"/>
        <circle cx="105.4" cy="-210.8" r="8" stroke-width="1.5" stroke-opacity="0.5"/>

        <g id="arm-elbow" transform="translate(155,-310)">
          <path d="M18.7,-5 L86.6,274.7 L61.4,281.3 L-18.7,5 Z" stroke-width="2.5" stroke-opacity="0.9"/>
          <path d="M-6.8,1.8 L67.2,279.8" stroke-width="1" stroke-opacity="0.3"/>
          <circle cx="29.6" cy="111.2" r="7" stroke-width="1.5" stroke-opacity="0.5"/>

          <g id="arm-wrist" transform="translate(74,278)">
            <path d="M-10,2 L10,2 L7,30 L-7,30 Z" stroke-width="2" stroke-opacity="0.85"/>
            <path d="M-9,10 H9" stroke-width="1" stroke-opacity="0.3"/>

            <g id="gripper" transform="translate(0,34)">
              <path d="M-13,0 H13 L8,22 H-8 Z" stroke-width="2.2" stroke-opacity="0.9"/>
              <path d="M-9,7 H9" stroke-width="1" stroke-opacity="0.3"/>
              <circle cx="0" cy="13" r="2.5" fill="#d6c4a8" fill-opacity="0.6" stroke="none"/>
              <path d="M-8,22 L-11.5,52" stroke-width="2" stroke-opacity="0.9"/>
              <path d="M8,22 L11.5,52" stroke-width="2" stroke-opacity="0.9"/>
              <path d="M-11.5,52 Q-12,60 -6,63" stroke-width="2" stroke-opacity="0.85"/>
              <path d="M11.5,52 Q12,60 6,63" stroke-width="2" stroke-opacity="0.85"/>

              <g id="chip" transform="translate(0,50)">
                <rect x="-11" y="-7" width="22" height="14" rx="2.5"
                      fill="#d6c4a8" fill-opacity="0.16"
                      stroke="#d6c4a8" stroke-width="2" stroke-opacity="0.85"/>
                <path d="M-14,-3.5 H-17.5 M-14,0 H-18 M-14,3.5 H-17.5 M14,-3.5 H17.5 M14,0 H18 M14,3.5 H17.5"
                      stroke="#d6c4a8" stroke-width="1.2" stroke-opacity="0.8"/>
                <circle cx="-4" cy="-1.5" r="1.4" fill="#f6f3ee" fill-opacity="0.95" stroke="none"/>
                <circle cx="4" cy="-1.5" r="1.4" fill="#f6f3ee" fill-opacity="0.95" stroke="none"/>
                <path d="M-4.2,1.8 Q0,5.6 4.2,1.8" stroke="#f6f3ee" stroke-width="1.3" stroke-opacity="0.95"/>
              </g>
            </g>

            <g transform="translate(0,0)">
              <circle r="11" stroke-width="2" stroke-opacity="0.85"/>
              <circle r="4.5" stroke-width="1" stroke-opacity="0.6"/>
              <path d="M0,-6.5 L0,-9.5 M5.6,3.2 L8.2,4.7 M-5.6,3.2 L-8.2,4.7" stroke-width="1" stroke-opacity="0.55"/>
              <circle r="1.4" fill="#f6f3ee" fill-opacity="0.8" stroke="none"/>
            </g>
          </g>
        </g>

        <g transform="translate(155,-310)">
          <circle r="16" stroke-width="2.2" stroke-opacity="0.9"/>
          <circle r="6.5" stroke-width="1.2" stroke-opacity="0.6"/>
          <path d="M0,-9.5 L0,-13.5 M9.5,0 L13.5,0 M0,9.5 L0,13.5 M-9.5,0 L-13.5,0" stroke-width="1" stroke-opacity="0.55"/>
          <circle r="1.8" fill="#f6f3ee" fill-opacity="0.8" stroke="none"/>
        </g>
      </g>

      <g transform="translate(225,660)">
        <circle r="20" stroke-width="2.5" stroke-opacity="0.95"/>
        <circle r="8.5" stroke-width="1.5" stroke-opacity="0.7"/>
        <path d="M8.5,8.5 L11.7,11.7 M-8.5,8.5 L-11.7,11.7 M-8.5,-8.5 L-11.7,-11.7 M8.5,-8.5 L11.7,-11.7" stroke-width="1" stroke-opacity="0.55"/>
        <circle r="2.2" fill="#f6f3ee" fill-opacity="0.8" stroke="none"/>
      </g>
    </g>

    <g id="ambient-marks">
      <path d="M1378,298 H1406 M1392,284 V312" stroke-width="1" stroke-opacity="0.15"/>
      <path d="M1447,505 H1469 M1458,494 V516" stroke-width="1" stroke-opacity="0.08"/>
      <path d="M1298,898 H1524" stroke-width="1" stroke-opacity="0.12"/>
      <path d="M1300,898 V890 M1340,898 V884 M1380,898 V890 M1420,898 V884 M1460,898 V890 M1500,898 V884" stroke-width="1" stroke-opacity="0.08"/>
    </g>

  </g>
</svg>
